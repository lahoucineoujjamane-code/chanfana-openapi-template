name: طبيب الأعشاب — بناء تطبيق أندرويد (APK)

on:
  push:
    paths:
      - "medicine-app/**"
      - ".github/workflows/medicine-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: التحقق من البيانات ومحرك الترجيح
        run: node medicine-app/tests/validate.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # مفتاح توقيع ثابت بين البناءات حتى تُثبَّت النسخ الجديدة كتحديث
      - name: استرجاع مفتاح التصحيح الثابت
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tabib-debug-keystore-v1

      - name: مفتاح التوقيع من GitHub Secrets (اختياري)
        env:
          KS_B64: ${{ secrets.TABIB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tabib.jks"
            echo "TABIB_KEYSTORE_FILE=$RUNNER_TEMP/tabib.jks" >> "$GITHUB_ENV"
            echo "سيتم التوقيع بالمفتاح الخاص"
          else
            echo "لا يوجد مفتاح خاص — سيتم التوقيع بمفتاح التصحيح الثابت"
          fi

      - name: بناء APK
        working-directory: medicine-app/android
        env:
          TABIB_KEYSTORE_PASSWORD: ${{ secrets.TABIB_KEYSTORE_PASSWORD }}
          TABIB_KEY_ALIAS: ${{ secrets.TABIB_KEY_ALIAS }}
          TABIB_KEY_PASSWORD: ${{ secrets.TABIB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/tabib-al-aashab.apk
          if [ -n "$TABIB_KEYSTORE_FILE" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          else
            # بدون مفتاح خاص: AAB غير موقّع (يوقَّع بمفتاح الرفع قبل Google Play)
            ./gradlew bundleRelease -Ptabib.unsignedBundle=true --no-daemon --stacktrace
          fi
          cp app/build/outputs/bundle/release/app-release.aab ../dist/tabib-al-aashab.aab

      - uses: actions/upload-artifact@v4
        with:
          name: tabib-al-aashab-apk
          path: medicine-app/dist/tabib-al-aashab.apk
          if-no-files-found: error

      # ملف AAB لـ Google Play (يجب أن يكون موقّعاً بمفتاح الرفع من GitHub Secrets)
      - uses: actions/upload-artifact@v4
        with:
          name: tabib-al-aashab-aab-google-play
          path: medicine-app/dist/tabib-al-aashab.aab
          if-no-files-found: error

      # رفع تلقائي إلى Google Play (مسودة على مسار الاختبار الداخلي)
      # يعمل فقط بعد إضافة السر PLAY_SERVICE_ACCOUNT_JSON وبعد أول رفع يدوي من Play Console
      - name: الرفع إلى Google Play
        if: ${{ env.PLAY_JSON != '' && env.TABIB_KEYSTORE_FILE != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tabib.herbs
          releaseFiles: medicine-app/dist/tabib-al-aashab.aab
          track: internal
          status: draft

      # نشر آخر نسخة كـ Release برابط تنزيل مباشر (بدون ZIP وبدون تسجيل دخول)
      - name: نشر آخر نسخة على صفحة Releases
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/comprehensive-medicine-app-6fe258' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            medicine-app/dist/tabib-al-aashab.apk \
            medicine-app/dist/tabib-al-aashab.aab \
            --target "$GITHUB_SHA" --prerelease \
            --title "طبيب الأعشاب — آخر نسخة (${GITHUB_RUN_NUMBER})" \
            --notes "تحميل مباشر: tabib-al-aashab.apk للتثبيت على الهاتف. ملف .aab خاص بـ Google Play."
